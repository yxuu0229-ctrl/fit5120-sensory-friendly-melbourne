name: Sync Melbourne Open Data

on:
  schedule:
    # City of Melbourne past-hour dataset refreshes about every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Sync mode
        required: true
        default: live
        type: choice
        options:
          - live
          - full

concurrency:
  group: sync-melbourne-open-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MELBOURNE_DATA_BASE_URL: https://data.melbourne.vic.gov.au/api/v2/catalog/datasets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run sync
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "full" ]; then
            npm run sync:full
          else
            npm run sync
          fi
