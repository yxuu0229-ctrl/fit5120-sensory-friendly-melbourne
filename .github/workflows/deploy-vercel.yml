name: Deploy develop to Vercel

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-vercel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Vercel CLI
        run: npm install --global vercel@58.9.0

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build for Vercel
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Prepare deployment package
        run: |
          mkdir -p /tmp/vercel-deploy/.vercel
          cp -R .vercel/output /tmp/vercel-deploy/.vercel/output
          cp .vercel/project.json /tmp/vercel-deploy/.vercel/project.json

      - name: Deploy to production
        working-directory: /tmp/vercel-deploy
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
